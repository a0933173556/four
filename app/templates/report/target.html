{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0 text-center fw-bold">設定每月減碳目標</h4>
            </div>
            <div class="card-body p-4 text-center">
                <p class="text-muted mb-4">為自己設定一個挑戰目標，幫助地球減少碳排放！</p>
                <form action="{{ url_for('report.target') }}" method="POST">
                    <div class="mb-4">
                        <label for="target_carbon_emission" class="form-label fw-bold">目標碳排放量 (kg CO₂e)</label>
                        <input type="number" step="0.01" class="form-control form-control-lg text-center mx-auto" style="max-width: 200px;" id="target_carbon_emission" name="target_carbon_emission" value="{{ g.user['target_carbon_emission'] }}" required>
                    </div>
                    <div class="d-grid gap-2 d-md-block">
                        <button type="submit" class="btn btn-primary px-4">更新目標</button>
                        <a href="{{ url_for('ledger.index') }}" class="btn btn-light px-4">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
