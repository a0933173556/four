{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0 text-center fw-bold">設定每月減碳目標</h4>
            </div>
            <div class="card-body p-4 text-center">
                <p class="text-muted mb-4">為自己設定一個挑戰目標，幫助地球減少碳排放！</p>
                <form action="{{ url_for('report.target') }}" method="POST">
                    <div class="mb-4">
                        <label for="target_carbon_emission" class="form-label fw-bold">目標碳排放量 (kg CO₂e)</label>
                        <input type="number" step="0.01" class="form-control form-control-lg text-center mx-auto" style="max-width: 200px;" id="target_carbon_emission" name="target_carbon_emission" value="{{ g.user['target_carbon_emission'] }}" required>
                    </div>
                    <div class="d-grid gap-2 d-md-block">
                        <button type="submit" class="btn btn-primary px-4">更新目標</button>
                        <a href="{{ url_for('ledger.index') }}" class="btn btn-light px-4">取消</a>
                    </div>
                </form>
            </div>
{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center fade-in">
    <div class="col-md-6 col-lg-5">
        <div class="text-center mb-4">
            <h1 class="h3 mb-2">設定減碳目標</h1>
            <p class="text-muted">設定一個挑戰目標，幫助您維持低碳生活</p>
        </div>

        <div class="card glass-card">
            <div class="card-body p-4 p-md-5">
                <form action="{{ url_for('report.update_target') }}" method="POST">
                    <div class="mb-4 text-center">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success bg-opacity-25 text-success mb-3" style="width: 80px; height: 80px;">
                            <i class="bi bi-bullseye fs-1"></i>
                        </div>
                        <h5 class="mb-1">每月目標基準</h5>
                        <p class="text-muted small">建議設定低於台灣平均值的碳排放量</p>
                    </div>

                    <div class="mb-4">
                        <label for="target_carbon_emission" class="form-label text-muted small fw-bold text-uppercase">目標排放量 (kg CO2e)</label>
                        <div class="input-group">
                            <input type="number" step="0.1" min="0" class="form-control form-control-lg" id="target_carbon_emission" name="target_carbon_emission" value="{{ target if target else 0 }}" required placeholder="例如: 250">
                            <span class="input-group-text bg-transparent text-muted border-start-0">kg</span>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            <i class="bi bi-check-lg me-1"></i> 儲存目標設定
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-transparent border-0 px-4 px-md-5 pb-4 text-center">
                <a href="{{ url_for('report.report_page') }}" class="text-decoration-none text-muted small hover-success">
                    <i class="bi bi-arrow-left me-1"></i> 返回報表
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
