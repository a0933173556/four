{% extends 'base.html' %}

{% block title %}設定減碳目標 - 數位足跡帳本{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0">
            <div class="card-header bg-success text-white py-3 text-center">
                <h4 class="mb-0 fw-bold">🎯 設定每月減碳目標</h4>
            </div>
            <div class="card-body p-4 text-center">
                <p class="text-muted mb-4">為自己設定一個挑戰目標，幫助地球減少碳排放！</p>
                <form action="{{ url_for('report.update_target') }}" method="POST">
                    <div class="mb-4">
                        <label for="target_carbon_emission" class="form-label fw-bold">目標碳排放量 (kg CO₂e)</label>
                        <div class="input-group">
                            <input type="number" step="0.1" min="0" class="form-control form-control-lg"
                                   id="target_carbon_emission" name="target_carbon_emission"
                                   value="{{ target if target else 0 }}" required placeholder="例如: 250">
                            <span class="input-group-text">kg</span>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg">✅ 儲存目標設定</button>
                        <a href="{{ url_for('ledger.index') }}" class="btn btn-outline-secondary">取消返回</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
