{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center fade-in">
    <div class="col-md-6 col-lg-5">
        <div class="card glass-card">
            <div class="card-header bg-transparent border-0 pt-4 px-4 text-center">
                <h3 class="mb-0">建立新帳號</h3>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('auth.handle_register') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label text-muted">使用者名稱</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label text-muted">密碼</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label text-muted">確認密碼</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">註冊帳號</button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-transparent border-0 pb-4 text-center">
                <p class="text-muted mb-0">已有帳號？ <a href="{{ url_for('auth.login_page') }}" class="text-primary text-decoration-none">點此登入</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
